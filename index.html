<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentin ?</title>
  <style>
    :root{
      --hot:#ff2e63;
      --pink:#db282e;
      --purple:#7c3aed;
      --blue:#3b82f6;
      --cyan:#22d3ee;
      --glass: rgba(255,255,255,.18);
      --stroke: rgba(255,255,255,.35);
      --shadow: 0 20px 60px rgba(0,0,0,.18);
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

      /* Dégradé plus “kitsch moderne” avec du bleu */
      background:
        radial-gradient(1000px 700px at 15% 20%, rgba(255,255,255,.85) 0%, transparent 55%),
        radial-gradient(900px 650px at 85% 10%, rgba(255,255,255,.75) 0%, transparent 50%),
        linear-gradient(135deg, #ffd1e8 0%, #bfa7ff 35%, #6aa9ff 70%, #7df0ff 100%);

      overflow:hidden;
      color:#1f2937;
      padding: 18px;
    }

    /* petits coeurs flottants */
    .heart {
      position: fixed;
      bottom: -40px;
      font-size: 18px;
      opacity: .85;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
      pointer-events:none;
      z-index: 0;
    }
    @keyframes floatUp{
      to { transform: translateY(-120vh) translateX(var(--drift)); opacity: 0; }
    }

    .card{
      width:min(520px, 100%);
      border-radius: 28px;
      padding: 26px 18px 22px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: relative;
      z-index: 2;
    }

    .badge{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.65);
      font-weight: 700;
      font-size: 13px;
      color: #6b7280;
    }

    h1{
      margin: 14px 0 6px;
      font-size: clamp(26px, 5.5vw, 38px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-align:center;
      color: #111827;
    }
    h1 .pink{
      color: var(--hot);
      text-shadow: 0 10px 22px rgba(255,46,99,.25);
    }

    p{
      margin: 10px auto 0;
      text-align:center;
      color:#374151;
      max-width: 38ch;
      font-size: 15px;
    }

    .stage{
      position: relative;
      margin-top: 22px;
      height: 190px;
      border-radius: 20px;
      background: rgba(255,255,255,.25);
      border: 1px dashed rgba(255,255,255,.55);
      overflow: hidden;
    }

    .btn{
      position:absolute;
      border:none;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      user-select:none;
      touch-action: manipulation;
      transition: transform .18s ease, box-shadow .18s ease, left .12s ease, top .12s ease;
      box-shadow: 0 14px 26px rgba(0,0,0,.15);
      min-width: 132px;
      z-index: 2;
    }
    .btn:active{ transform: scale(.98); }

    #yesBtn{
      background: linear-gradient(135deg, #34d399, #22c55e);
      color: white;
    }

    #noBtn{
      background: rgba(255,255,255,.78);
      color: #111827;
      border: 1px solid rgba(255,255,255,.9);
    }

    .wiggle{ animation: wiggle .25s ease; }
    @keyframes wiggle{
      0%{ transform: scale(var(--scale,1)) rotate(0deg); }
      35%{ transform: scale(var(--scale,1)) rotate(-4deg); }
      70%{ transform: scale(var(--scale,1)) rotate(4deg); }
      100%{ transform: scale(var(--scale,1)) rotate(0deg); }
    }

    .footer{
      margin-top: 14px;
      display:flex;
      justify-content:center;
      gap:10px;
      font-size: 12px;
      color:#6b7280;
    }

    /* écran final */
    .overlay{
      position: fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 5;
      background: rgba(240, 248, 255, .45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
    }
    .overlay.show{ display:flex; }
    .modal{
      width:min(520px, 100%);
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 28px;
      padding: 22px 18px;
      text-align:center;
      box-shadow: var(--shadow);
    }
    .modal h2{
      margin: 6px 0 6px;
      font-size: 28px;
      color:#111827;
    }
    .modal .big{
      font-size: 40px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.12));
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="display:flex;justify-content:center;">
      <div class="badge">💘 Margodouin 2026 Edition</div>
    </div>

    <h1>Veux tu être <span class="pink">mon Valentin ?</span> ?</h1>
    <p>Promis, c’est sans piège… enfin presque 😇</p>

    <div class="stage" id="stage">
      <button class="btn" id="yesBtn">Oui 💖</button>
      <button class="btn" id="noBtn">Non 🙄</button>
    </div>

    <div class="footer">
      <span>Astuce :</span>
      <span>essaie d’attraper “Non” 😈</span>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="big">💞✨💞</div>
      <h2>YESSSS !</h2>
      <p>Ok c’est officiel : on est trop mignons 😭❤️</p>
      <p style="margin-top:12px;font-size:12px;color:#6b7280;">(Tu peux fermer l’onglet maintenant et aller faire un câlin.)</p>
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const overlay = document.getElementById("overlay");

    // Séparation propre au démarrage (positions en px dans l'encart)
    function placeInitialButtons(){
      const s = stage.getBoundingClientRect();
      const y = Math.round(s.height * 0.55);

      yesBtn.style.left = Math.round(s.width * 0.35) + "px";
      yesBtn.style.top  = y + "px";

      noBtn.style.left  = Math.round(s.width * 0.70) + "px";
      noBtn.style.top   = y + "px";

      // reset scale visuel
      yesBtn.style.setProperty("--scale", "1");
      yesBtn.style.transform = "scale(1)";
      noBtn.style.transform = "scale(1)";
    }

    let yesScale = 1;
    const noTexts = ["Non 🙄", "T’es sûr ? 😏", "Vraiment ? 🥺", "Re-réfléchis 😇", "Allez stp 😭", "Ok ok… NON ? 😈"];
    let noIndex = 0;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoRandom() {
      const s = stage.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // Zone beaucoup plus large : quasi toute la surface
      const margin = 6; // petit bord pour éviter de sortir
      const maxX = s.width  - b.width  - margin*2;
      const maxY = s.height - b.height - margin*2;

      const x = margin + Math.random() * maxX;
      const y = margin + Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top  = `${y}px`;
    }

    function dodge() {
      noIndex = (noIndex + 1) % noTexts.length;
      noBtn.textContent = noTexts[noIndex];

      // Oui grossit légèrement
      yesScale *= 1.08;
      yesScale = clamp(yesScale, 1, 2.2);
      yesBtn.style.transform = `scale(${yesScale})`;

      yesBtn.classList.remove("wiggle");
      void yesBtn.offsetWidth;
      yesBtn.classList.add("wiggle");

      moveNoRandom();
    }

    // Mobile: fuite au touchstart
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      dodge();
    }, { passive: false });

    // Desktop: fuite au survol
    noBtn.addEventListener("mouseenter", dodge);

    // Si clic quand même
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      dodge();
    });

    yesBtn.addEventListener("click", () => {
      overlay.classList.add("show");
      burstConfetti(110);
      for(let i=0;i<18;i++) spawnHeart();
    });

    overlay.addEventListener("click", () => overlay.classList.remove("show"));

    // Coeurs flottants en continu
    function spawnHeart() {
      const el = document.createElement("div");
      el.className = "heart";
      const hearts = ["💖","💘","💝","💗","💕","💞","❤️","💟","💓","😍"];
      el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      el.style.left = Math.random()*100 + "vw";
      el.style.setProperty("--drift", (Math.random()*140 - 70) + "px");
      el.style.animationDuration = (4 + Math.random()*3) + "s";
      el.style.fontSize = (16 + Math.random()*18) + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 8000);
    }
    setInterval(spawnHeart, 360);

    // Confettis
    function burstConfetti(count=80){
      for(let i=0;i<count;i++){
        const p = document.createElement("div");
        p.style.position = "fixed";
        p.style.left = (50 + (Math.random()*20-10)) + "vw";
        p.style.top  = (45 + (Math.random()*10-5)) + "vh";
        p.style.width = (6 + Math.random()*8) + "px";
        p.style.height= (6 + Math.random()*10) + "px";
        p.style.borderRadius = "4px";
        p.style.background = `hsl(${Math.random()*360}, 90%, 65%)`;
        p.style.zIndex = 6;
        p.style.pointerEvents = "none";
        const dx = (Math.random()*2-1) * 260;
        const dy = (Math.random()*-1) * 460 - 140;
        const rot = (Math.random()*2-1) * 760;
        const dur = 900 + Math.random()*650;

        p.animate([
          { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
        ], { duration: dur, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });

        document.body.appendChild(p);
        setTimeout(()=>p.remove(), dur+60);
      }
    }

    // Initialisation + recalcul au resize/orientation
    window.addEventListener("load", () => {
      placeInitialButtons();
      // un petit délai pour être sûr des tailles après render
      setTimeout(placeInitialButtons, 80);
    });
    window.addEventListener("resize", () => {
      placeInitialButtons();
    });
  </script>
</body>
</html>
